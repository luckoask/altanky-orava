<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>DomOrava 3D build</title>
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Builds the model from code. ?w=&h=&yaw=&pitch=&plants=0&q=2&bg=1
// window.exportGLB() -> base64 of a binary glTF (used by tools/export.mjs)
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { buildPavilion } from './pavilion3d.js';
import { createStage } from './stage.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || innerWidth), H = +(q.get('h') || innerHeight);
const canvas = document.getElementById('c');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
if (q.get('bg')) document.body.style.background = q.get('bg') === '1' ? '#f6f3ed' : '#' + q.get('bg');

const t0 = performance.now();
const { group } = buildPavilion({ plants: q.get('plants') !== '0', quality: +(q.get('q') || 1) });
const buildMs = performance.now() - t0;
const stage = createStage(canvas, { width: W, height: H });
stage.scene.add(group);
stage.frame(group, { yaw: +(q.get('yaw') || 0), pitch: +(q.get('pitch') || 4), margin: +(q.get('margin') || 1.06) });
if (q.get('cam')) {
  // cam=x,y,z,tx,ty,tz,fov for close-ups
  const [x, y, z, tx, ty, tz, fov] = q.get('cam').split(',').map(Number);
  stage.camera.position.set(x, y, z);
  if (fov) stage.camera.fov = fov;
  stage.camera.lookAt(tx, ty, tz);
  stage.camera.updateProjectionMatrix();
}
stage.render();

let tris = 0;
group.traverse((o) => { if (o.isMesh) tris += o.geometry.attributes.position.count / 3; });
window.stats = { buildMs: Math.round(buildMs), meshes: group.children.length, tris: Math.round(tris) };

window.exportGLB = async (maxTextureSize = 1024) => {
  // re-index merged meshes (shared vertices) before writing
  const out = group.clone(true);
  out.traverse((o) => {
    if (o.isMesh) {
      o.geometry = mergeVertices(o.geometry, 1e-5);
      o.castShadow = o.receiveShadow = false;
    }
  });
  const buf = await new GLTFExporter().parseAsync(out, { binary: true, maxTextureSize });
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script>
</body>
</html>
